name: Account Switch Supply Diagnostic
on:
  push:
    branches: [account-switch-supply-test-20261005]
    paths:
      - 'research/**'
      - '.github/workflows/account-switch-supply.yml'
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 lxml openpyxl
      - run: python research/account_switch_diag.py
      - uses: actions/upload-artifact@v4
        with:
          name: account-switch-diag
          path: research/out
          retention-days: 1
